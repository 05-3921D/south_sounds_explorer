<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>South Sounds Explorer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="background-gradient"></div>

    <main class="container">
        <header class="hero">
            <a href="/" style="text-decoration: none; color: inherit; cursor: pointer;">
                <h1>South Sounds <span class="accent">Explorer</span></h1>
            </a>
            <p>Descubre los ritmos de América del Sur</p>
        </header>

        <section class="search-section">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Busca artistas, álbumes, canciones..."
                    autocomplete="off">
                <button id="searchBtn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8" />
                        <path d="m21 21-4.3-4.3" />
                    </svg>
                </button>
            </div>
        </section>

        <!-- New: Genre Suggestions -->
        <section class="suggestions-section">
            <h3>Descubre Géneros</h3>
            <div class="genre-chips" id="genreChipsContainer">
                <!-- Se llenarán dinámicamente con JS -->
            </div>

            <h3 style="margin-top: 2rem;">Explora por País</h3>
            <div class="genre-chips" id="countryChipsContainer">
                <!-- Se llenarán dinámicamente con JS -->
            </div>
        </section>

        <!-- New: Featured / Suggested Tabs -->
        <section class="featured-header">
            <h3>Recomendados Para Ti</h3>
            <div class="tabs">
                <button class="tab-btn active" data-sort="best">Destacados</button>
                <button class="tab-btn" data-sort="recent">Más Recientes</button>
            </div>
        </section>

        <section id="results" class="results-grid">
            <!-- Results will appear here -->
            <div class="empty-state">
                <div class="spinner"></div>
                <p>Cargando sugerencias...</p>
            </div>
        </section>

        <!-- New: Pagination -->
        <div class="pagination-section">
            <button id="loadMoreBtn" class="primary-btn hidden">
                <span>Cargar más</span>
            </button>
        </div>
    </main>

    <!-- Scroll to Top Button -->
    <button id="scrollTopBtn" class="scroll-top-btn hidden" title="Volver al comienzo">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m18 15-6-6-6 6" />
        </svg>
    </button>

    <script src="js/app.js"></script>
</body>

</html>
